name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile package
        run: python -m compileall -q src

      - name: CLI smoke test
        run: poster-vector --help

      - name: Run test suite
        run: pytest -q

  vector-smoke:
    name: SVG / PDF renderer smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install system renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape ghostscript

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build editable SVG fixture
        run: |
          mkdir -p ci-output
          poster-vector build configs/gfc_background.yaml -o ci-output/background.svg
          test -s ci-output/background.svg
          if grep -Eiq '<(svg:)?image([ >])' ci-output/background.svg; then
            echo 'Unexpected embedded raster image found in SVG.' >&2
            exit 1
          fi

      - name: Render SVG with Inkscape
        run: |
          inkscape ci-output/background.svg --export-type=png --export-filename=ci-output/background.png
          test -s ci-output/background.png

      - name: Export vector PDF with Inkscape
        run: |
          inkscape ci-output/background.svg --export-type=pdf --export-filename=ci-output/background.pdf
          test -s ci-output/background.pdf

      - name: Validate PDF with Ghostscript
        run: |
          gs -q -dNOPAUSE -dBATCH -sDEVICE=nullpage ci-output/background.pdf
